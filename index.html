<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>회복 &amp; 성장 통합 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      color: #0f172a;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f8fafc;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: #f8fafc;
      z-index: 10;
      transition: opacity 0.15s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #059669, #0284c7, #f59e0b);
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    .boot-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .boot-sub {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="logo-badge">🌱</div>
    <div class="boot-title">회복 &amp; 성장 통합 대시보드</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 통합 데이터를 초고속으로 불러오는 중…</div>
  </div>

  <iframe id="appFrame" title="회복 & 성장 통합 대시보드"></iframe>

  <script>
    (() => {
      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app';
      const GAS_URL = 'https://script.google.com/macros/s/AKfycbzihf4YmTK0KTi3XuHF9JQ8v9C7ofLXmwhXVFxGrd5gIaKcCvIIlnISdTf5v3hGQMoj/exec';
      const DATA_CACHE_KEY = 'recovery-dashboard-data-v4';
      const UI_CACHE_KEY = 'recovery-dashboard-ui-v4';
      const CHANNEL = 'recovery-dashboard-v1';

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');
      const cleanFbUrl = FIREBASE_DB_URL.replace(/\/+$/, '');

      function toArray(val) {
        if (!val) return [];
        if (Array.isArray(val)) return val.filter(v => v != null);
        if (typeof val === 'object') {
          return Object.keys(val)
            .sort((a, b) => Number(a) - Number(b))
            .map(k => val[k])
            .filter(v => v != null);
        }
        return [];
      }

      // Firebase에서 빈 배열(dates: [])이 생략되거나 객체로 바뀌어도 정상 배열로 완벽 복원
      function normalizeGrowthData(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const books = toArray(raw.books).map(b => ({
          title: String(b.title || ''),
          author: String(b.author || ''),
          status: String(b.status || '미완독'),
          date: String(b.date || ''),
          publisher: String(b.publisher || ''),
          bookId: String(b.bookId || ''),
          url: String(b.url || ''),
          year: Number(b.year) || 2026
        }));
        const gaList = toArray(raw.gaList).map(g => ({
          date: String(g.date || ''),
          meeting: String(g.meeting || 'GA모임')
        })).filter(g => g.date);
        const diaryDates = toArray(raw.diaryDates).map(String).filter(Boolean).sort();
        const habitData = toArray(raw.habitData).map(h => ({
          ...h,
          id: String(h.id || ''),
          name: String(h.name || ''),
          dates: toArray(h.dates).map(String).filter(Boolean).sort(),
          startDate: String(h.startDate || '')
        }));
        return {
          ...raw,
          books,
          gaList,
          diaryDates,
          habitData,
          habitError: !!raw.habitError
        };
      }

      // 1. 페이지 시작 즉시 클라우드 UI와 통합 데이터를 병렬 프리패치
      let currentUiHtml = '';
      let currentData = null;
      let uiRendered = false;

      // 2. 구글 앱스크립트 백그라운드 브리지 연결 (수동 새로고침 및 최초 1회 초기화용)
      let bridgeSource = null;
      let bridgeOrigin;
      let bridgeReadyPromise = null;
      const bridgePending = new Map();

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            bridgeOrigin = event.origin;
            if (window.__resolveBridgeReady) window.__resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = bridgePending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        bridgePending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      function connectBridge() {
        if (bridgeReadyPromise) return bridgeReadyPromise;
        bridgeReadyPromise = new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('시트 브리지 연결 시간 초과')), 15000);
          window.__resolveBridgeReady = () => {
            clearTimeout(timer);
            resolve();
          };
        });
        const frame = document.createElement('iframe');
        frame.title = '회복 & 성장 시트 연결';
        frame.setAttribute('aria-hidden', 'true');
        frame.tabIndex = -1;
        frame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0';
        frame.src = GAS_URL + '?bridge=1';
        document.body.appendChild(frame);
        return bridgeReadyPromise;
      }

      function fetchFromSheetBridge(forceFresh, includeUi) {return request('getClientPayload',[!!forceFresh,!!includeUi]);}
      async function request(method,args) {
        await connectBridge();
        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            bridgePending.delete(id);
            reject(new Error('시트 응답 시간 초과'));
          }, 25000);
          bridgePending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({
            channel: CHANNEL,
            id,
            method, sessionToken,
            args
          }, bridgeOrigin);
        });
      }

      
      // 내부 UI에서 getDashboardData(forceFresh) 호출 시 처리
      window.__fetchDashboardFromGAS = async (forceFresh) => {
        if (!forceFresh && currentData) {
          return currentData;
        }
        // 사용자가 [시트 새로고침]을 눌렀을 때만 시트 브리지 호출 후 클라우드 갱신
        try {
          const res = await fetchFromSheetBridge(true, false);
          const fresh = normalizeGrowthData(res ? res.data : null);
          if (fresh) {
            currentData = fresh;
            try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(fresh)); } catch (_) {}
            return fresh;
          }
        } catch (_) {
          // 서버 지연 시 마지막 인증된 조회 결과를 사용한다.
        }
        return currentData;
      };

      function buildPatchedHtml(rawHtml, bootstrapData) {
        const safeJson = JSON.stringify(bootstrapData || null).replace(/[<>&]/g, (ch) => {
          return '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0');
        });
        const closeTag = '<' + '/script>';
        const bridgeScript =
          '<script>\n' +
          '  window.__DASHBOARD_BOOTSTRAP__ = ' + safeJson + ';\n' +
          '  window.google = {\n' +
          '    script: {\n' +
          '      run: (function() {\n' +
          '        function makeRunner(onSuccess, onFailure) {\n' +
          '          return {\n' +
          '            withSuccessHandler: function(fn) { return makeRunner(fn, onFailure); },\n' +
          '            withFailureHandler: function(fn) { return makeRunner(onSuccess, fn); },\n' +
          '            getDashboardData: function(forceFresh) {\n' +
          '              if (!window.parent || !window.parent.__fetchDashboardFromGAS) return;\n' +
          '              window.parent.__fetchDashboardFromGAS(!!forceFresh)\n' +
          '                .then(function(data) { if (onSuccess) onSuccess(data); })\n' +
          '                .catch(function(err) { if (onFailure) onFailure(err); });\n' +
          '            }\n' +
          '          };\n' +
          '        }\n' +
          '        return makeRunner(null, null);\n' +
          '      })()\n' +
          '    }\n' +
          '  };\n' +
          closeTag;

        const widgetRe = new RegExp('<script[^>]*sites-widget\\.js[^>]*>[\\s\\S]*?<' + '/script>', 'gi');
        const bootstrapRe = new RegExp('window\\.__DASHBOARD_BOOTSTRAP__\\s*=\\s*[\\s\\S]*?;\\s*<' + '/script>', 'i');

        let cleaned = String(rawHtml || '')
          .replace(widgetRe, '')
          .replace(bootstrapRe, closeTag)
          .replace(/https:\/\/[a-z0-9.-]+\.chatgpt\.site/gi, 'https://recoverist02.github.io')
          .replace(/window\.location\.replace\(\s*['"]about:blank['"]\s*\)/g, 'void 0');

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (match) => match + bridgeScript);
        }
        return bridgeScript + cleaned;
      }

      function renderIntoFrame(uiHtml, dataObj) {
        if (!uiHtml || !dataObj) return;
        appFrame.onload = () => bootOverlay.classList.add('hidden');
        appFrame.srcdoc = buildPatchedHtml(uiHtml, dataObj);
        setTimeout(() => bootOverlay.classList.add('hidden'), 150);
        uiRendered = true;
      }

      async function boot() {
        // 로컬 캐시 폴백
        if (!currentData || !currentUiHtml) {
          try {
            if (!currentUiHtml) currentUiHtml = localStorage.getItem(UI_CACHE_KEY) || '';
            if (!currentData) {
              const raw = localStorage.getItem(DATA_CACHE_KEY);
              if (raw) currentData = normalizeGrowthData(JSON.parse(raw));
            }
          } catch (_) {}
        }

        

        // 클라우드가 비어있는 최초 1회에만 시트 브리지에서 가져와 클라우드 자동 세팅
        bootStatus.textContent = '대시보드 기록을 불러오는 중…';
        try {
          const res = await fetchFromSheetBridge(false, !currentUiHtml);
          const freshData = normalizeGrowthData(res ? res.data : null);
          const freshUi = (res && res.uiHtml) ? res.uiHtml : currentUiHtml;
          if (freshData) {
            currentData = freshData;
            try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(freshData)); } catch (_) {}
          }
          if (freshUi) {
            currentUiHtml = freshUi;
            try { localStorage.setItem(UI_CACHE_KEY, freshUi); } catch (_) {}
          }
          renderIntoFrame(currentUiHtml, currentData);
        } catch (err) {
          bootStatus.innerHTML = '앱스크립트에서 <b>installGrowthDashboardTriggers</b> 함수를 1회 실행해 주세요.';
        }
      }

      const authenticate = req => request(req.action,[req.pin || '',req.keep === true]);
      let sessionToken = '';
      const storageKey = 'private-app-session-v1';
      async function openPrivateApp() {
        const panel = document.createElement('dialog');
        panel.style.cssText = 'padding:24px;border:0;border-radius:16px;max-width:90vw;color:#122c30';
        panel.innerHTML = '<form><strong>개인용 앱 로그인</strong><p><label>4자리 PIN <input type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required size="5"></label></p><label><input type="checkbox" checked> 7일 유지</label> <button>로그인</button><p role="status"></p><a target="_blank" rel="noopener">Google 계정 확인</a></form>';
        panel.querySelector('a').href = GAS_URL;
        document.body.appendChild(panel);
        panel.addEventListener('cancel', event => event.preventDefault());
        panel.showModal();
        const form = panel.querySelector('form');
        const [pin, keep] = form.querySelectorAll('input');
        async function unlock(action) {
          const session = await authenticate(action);
          if (!session || typeof session.token !== 'string' || !(session.expiresAt > Date.now())) throw Error('LOGIN_REQUIRED');
          sessionToken = session.token;
          const remaining = session.expiresAt - Date.now();
          setTimeout(() => location.reload(), remaining);
          panel.remove();
          await boot();
        }
        sessionToken = localStorage.getItem(storageKey) || sessionStorage.getItem(storageKey) || '';
        form.onsubmit = async event => {
          event.preventDefault();
          form.querySelector('button').disabled = true;
          try {
            await unlock({action:'pin-login', pin:pin.value, keep:keep.checked});
            localStorage.removeItem(storageKey);
            sessionStorage.removeItem(storageKey);
            (keep.checked ? localStorage : sessionStorage).setItem(storageKey,sessionToken);
          } catch (error) {
            pin.value = '';
            form.querySelector('[role=status]').textContent = /TRY_LATER/.test(error.message) ? '15분 뒤에 다시 시도해줘.' : /INVALID_PIN/.test(error.message) ? 'PIN을 다시 확인해줘.' : 'Google 계정 확인 후 새로고침해줘.';
          } finally { form.querySelector('button').disabled = false; }
        };
        if (sessionToken) {
          form.querySelector('button').disabled = true;
          try { await unlock({action:'pin-resume', sessionToken}); }
          catch { sessionToken = ''; localStorage.removeItem(storageKey); sessionStorage.removeItem(storageKey); }
          finally { form.querySelector('button').disabled = false; }
        }
      }
      openPrivateApp();
    })();
  </script>
</body>
</html>
