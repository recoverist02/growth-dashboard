<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>회복 &amp; 성장 통합 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      color: #0f172a;
      overflow: hidden;
    }
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f8fafc;
      z-index: 1;
    }
    #bootOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: #f8fafc;
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    #bootOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #059669, #0284c7, #f59e0b);
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    .boot-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .boot-sub {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
    }
    .boot-actions {
      display: none;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 0;
      background: #4f46e5;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn.secondary {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="bootOverlay">
    <div class="logo-badge">🌱</div>
    <div class="boot-title">회복 &amp; 성장 통합 대시보드</div>
    <div class="boot-sub" id="bootStatus">클라우드에서 초고속으로 불러오는 중…</div>
    <div class="boot-actions" id="bootActions">
      <a class="btn secondary" href="https://script.google.com/macros/s/AKfycbzihf4YmTK0KTi3XuHF9JQ8v9C7ofLXmwhXVFxGrd5gIaKcCvIIlnISdTf5v3hGQMoj/exec" target="_blank" rel="noopener">구글 연결 확인</a>
      <button type="button" class="btn" onclick="location.reload()">다시 연결</button>
    </div>
  </div>

  <iframe id="appFrame" title="회복 & 성장 통합 대시보드"></iframe>

  <script>
    (() => {
      const FIREBASE_DB_URL = 'https://recoverist-hub-default-rtdb.asia-southeast1.firebasedatabase.app/';
      const cleanFbUrl = String(FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');
      const hasFirebase = cleanFbUrl.startsWith('https://');

      const GAS_URL = 'https://script.google.com/macros/s/AKfycbzihf4YmTK0KTi3XuHF9JQ8v9C7ofLXmwhXVFxGrd5gIaKcCvIIlnISdTf5v3hGQMoj/exec';
      const DATA_CACHE_KEY = 'recovery-dashboard-data-v3';
      const UI_CACHE_KEY = 'recovery-dashboard-ui-v3';
      const CHANNEL = 'recovery-dashboard-v1';

      const appFrame = document.getElementById('appFrame');
      const bootOverlay = document.getElementById('bootOverlay');
      const bootStatus = document.getElementById('bootStatus');
      const bootActions = document.getElementById('bootActions');

      let currentUiHtml = '';
      let currentData = null;
      let uiRendered = false;

      let bridgeSource = null;
      let bridgeFrame = null;
      let bridgeReadyPromise = null;
      const bridgePending = new Map();

      async function readCloud(key) {
        if (!hasFirebase) return null;
        try {
          const res = await fetch(`${cleanFbUrl}/growth/${key}.json`, { cache: 'no-store' });
          if (!res.ok) return null;
          return await res.json();
        } catch (_) {
          return null;
        }
      }

      async function writeCloud(key, data) {
        if (!hasFirebase || data === undefined || data === null) return;
        try {
          await fetch(`${cleanFbUrl}/growth/${key}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } catch (_) {}
      }

      window.addEventListener('message', (event) => {
        let host = '';
        try { host = new URL(event.origin).hostname; } catch (_) { return; }
        if (!host.endsWith('-script.googleusercontent.com') || !event.data || event.data.channel !== CHANNEL) return;
        if (event.data.type === 'ready') {
          if (!bridgeSource) {
            bridgeSource = event.source;
            if (window.__resolveBridgeReady) window.__resolveBridgeReady();
          }
          return;
        }
        if (event.source !== bridgeSource) return;
        const item = bridgePending.get(event.data.id);
        if (!item) return;
        clearTimeout(item.timer);
        bridgePending.delete(event.data.id);
        event.data.error ? item.reject(new Error(event.data.error)) : item.resolve(event.data.result);
      });

      function connectBridge() {
        if (bridgeReadyPromise) return bridgeReadyPromise;
        bridgeReadyPromise = new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            reject(new Error('브리지 연결 시간 초과'));
          }, 15000);
          window.__resolveBridgeReady = () => {
            clearTimeout(timer);
            resolve();
          };
        });
        bridgeFrame = document.createElement('iframe');
        bridgeFrame.title = 'Google Sheets 연결';
        bridgeFrame.setAttribute('aria-hidden', 'true');
        bridgeFrame.tabIndex = -1;
        bridgeFrame.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;border:0';
        bridgeFrame.src = GAS_URL + '?bridge=1';
        document.body.appendChild(bridgeFrame);
        return bridgeReadyPromise;
      }

      async function fetchDashboardPayload(forceFresh, includeUi) {
        await connectBridge();
        return new Promise((resolve, reject) => {
          const id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const timer = setTimeout(() => {
            bridgePending.delete(id);
            reject(new Error('시트 응답 시간 초과'));
          }, 25000);
          bridgePending.set(id, { resolve, reject, timer });
          bridgeSource.postMessage({
            channel: CHANNEL,
            id: id,
            method: 'getClientPayload',
            args: [!!forceFresh, !!includeUi]
          }, '*');
        });
      }

      // 내부 대시보드에서 새로고침/조회 호출 시: 클라우드 우선 응답 또는 강제 시트 동기화
      window.__fetchDashboardFromGAS = async (forceFresh) => {
        if (!forceFresh) {
          const cloudData = await readCloud('data');
          if (cloudData) {
            currentData = cloudData;
            try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(currentData)); } catch (_) {}
            // 백그라운드에서 구글 시트 최신본 확인 및 클라우드 갱신
            fetchDashboardPayload(false, false).then((res) => {
              if (res && res.data) {
                currentData = res.data;
                writeCloud('data', res.data);
                try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(res.data)); } catch (_) {}
              }
            }).catch(() => {});
            return cloudData;
          }
        }

        const res = await fetchDashboardPayload(!!forceFresh, false);
        if (res && res.data) {
          currentData = res.data;
          writeCloud('data', res.data);
          try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(currentData)); } catch (_) {}
        }
        return res ? res.data : currentData;
      };

      function buildPatchedHtml(rawHtml, bootstrapData) {
        const safeJson = JSON.stringify(bootstrapData || null).replace(/[<>&]/g, (ch) => {
          return '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0');
        });
        const closeTag = '<' + '/script>';
        const bridgeScript =
          '<script>\n' +
          '  window.__DASHBOARD_BOOTSTRAP__ = ' + safeJson + ';\n' +
          '  window.google = {\n' +
          '    script: {\n' +
          '      run: (function() {\n' +
          '        function makeRunner(onSuccess, onFailure) {\n' +
          '          return {\n' +
          '            withSuccessHandler: function(fn) { return makeRunner(fn, onFailure); },\n' +
          '            withFailureHandler: function(fn) { return makeRunner(onSuccess, fn); },\n' +
          '            getDashboardData: function(forceFresh) {\n' +
          '              if (!window.parent || !window.parent.__fetchDashboardFromGAS) return;\n' +
          '              window.parent.__fetchDashboardFromGAS(!!forceFresh)\n' +
          '                .then(function(data) { if (onSuccess) onSuccess(data); })\n' +
          '                .catch(function(err) { if (onFailure) onFailure(err); });\n' +
          '            }\n' +
          '          };\n' +
          '        }\n' +
          '        return makeRunner(null, null);\n' +
          '      })()\n' +
          '    }\n' +
          '  };\n' +
          closeTag;

        const widgetRe = new RegExp('<script[^>]*sites-widget\\.js[^>]*>[\\s\\S]*?<' + '/script>', 'gi');
        const bootstrapRe = new RegExp('window\\.__DASHBOARD_BOOTSTRAP__\\s*=\\s*[\\s\\S]*?;\\s*<' + '/script>', 'i');

        let cleaned = String(rawHtml || '')
          .replace(widgetRe, '')
          .replace(bootstrapRe, closeTag)
          .replace(/https:\/\/[a-z0-9.-]+\.chatgpt\.site/gi, 'https://recoverist02.github.io')
          .replace(/window\.location\.replace\(\s*['"]about:blank['"]\s*\)/g, 'void 0');

        if (/<head[^>]*>/i.test(cleaned)) {
          return cleaned.replace(/<head[^>]*>/i, (match) => match + bridgeScript);
        }
        return bridgeScript + cleaned;
      }

      function renderIntoFrame(uiHtml, dataObj) {
        if (!uiHtml) return;
        appFrame.onload = () => {
          bootOverlay.classList.add('hidden');
        };
        appFrame.srcdoc = buildPatchedHtml(uiHtml, dataObj);
        setTimeout(() => bootOverlay.classList.add('hidden'), 200);
        uiRendered = true;
      }

      function fallbackDirectEmbed() {
        if (uiRendered) return;
        appFrame.onload = () => {
          bootOverlay.classList.add('hidden');
        };
        appFrame.src = GAS_URL;
        setTimeout(() => bootOverlay.classList.add('hidden'), 1500);
        uiRendered = true;
      }

      async function boot() {
        // 1단계: 로컬 캐시 확인
        try {
          currentUiHtml = localStorage.getItem(UI_CACHE_KEY) || '';
          const rawData = localStorage.getItem(DATA_CACHE_KEY);
          if (rawData) currentData = JSON.parse(rawData);
        } catch (_) {}

        if (currentUiHtml && currentData) {
          renderIntoFrame(currentUiHtml, currentData);
        }

        // 2단계: Firebase 클라우드에서 0.1초 만에 최신 데이터 & UI 로드
        try {
          const [cloudData, cloudUi] = await Promise.all([
            readCloud('data'),
            currentUiHtml ? Promise.resolve(null) : readCloud('uiHtml')
          ]);

          if (cloudData) {
            currentData = cloudData;
            try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(cloudData)); } catch (_) {}
          }
          if (cloudUi && typeof cloudUi === 'string') {
            currentUiHtml = cloudUi;
            try { localStorage.setItem(UI_CACHE_KEY, cloudUi); } catch (_) {}
          }

          if (currentUiHtml && currentData) {
            renderIntoFrame(currentUiHtml, currentData);
          }
        } catch (_) {}

        // 3단계: 백그라운드에서 구글 시트 원본과 동기화 후 클라우드 최신화
        try {
          const needUi = !currentUiHtml;
          const res = await fetchDashboardPayload(false, needUi);
          const freshData = res ? res.data : null;
          const freshUi = (res && res.uiHtml) ? res.uiHtml : currentUiHtml;

          if (freshData) {
            const changed = JSON.stringify(freshData) !== JSON.stringify(currentData);
            currentData = freshData;
            writeCloud('data', freshData);
            try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify(freshData)); } catch (_) {}
            if ((!uiRendered || changed) && freshUi) {
              renderIntoFrame(freshUi, currentData);
            }
          }
          if (res && res.uiHtml) {
            currentUiHtml = res.uiHtml;
            writeCloud('uiHtml', res.uiHtml);
            try { localStorage.setItem(UI_CACHE_KEY, res.uiHtml); } catch (_) {}
          }

          if (!uiRendered && freshUi) {
            renderIntoFrame(freshUi, currentData);
          }

          if (!needUi) {
            fetchDashboardPayload(false, true).then((fullRes) => {
              if (fullRes && fullRes.uiHtml) {
                writeCloud('uiHtml', fullRes.uiHtml);
                if (fullRes.uiHtml !== currentUiHtml) {
                  currentUiHtml = fullRes.uiHtml;
                  try { localStorage.setItem(UI_CACHE_KEY, fullRes.uiHtml); } catch (_) {}
                  renderIntoFrame(currentUiHtml, fullRes.data || currentData);
                }
              }
            }).catch(() => {});
          }
        } catch (err) {
          console.warn('시트 백그라운드 동기화 지연:', err);
          if (!uiRendered) {
            fallbackDirectEmbed();
            bootActions.style.display = 'flex';
          }
        }
      }

      boot();
    })();
  </script>
</body>
</html>
